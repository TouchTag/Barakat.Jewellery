*{box-sizing:border-box}

body{
    margin: 0;

    background-image: url("closeup-marble-textured.jpeg");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: fixed;
    animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.wrap{

  margin:auto;
}

h1{
    margin:0;
    font-size:22px;
    color:#000000;
}

.tagline{
  color:#00000;
  font-size:16px;
  margin:8px 0 12px;
  
}

.social{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px 0 14px;
}

.map{
  margin:8px 0 14px;
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--stroke);
}

.map iframe{
  width:100%;
  height:180px;
  border:0;
  display:block;
}

.map a{
  display:block;
  text-align:center;
  padding:10px;
  background:rgba(0,0,0,.35);
  color:#000;
  text-decoration:none;
  font-size:13px;

}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;

  width:85%;
  height:65px;

  margin:0 auto 12px;
  border-radius:18px;

  background:rgba(255,255,255,0.30);
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.35);

  text-decoration:none;
  color:#bc8557 !important;

  transition:0.2s ease;
}

.btn i{
  font-size:32px;
  color:#bc8557;
}

.btn:hover{
  transform:scale(1.02);
  background:rgba(255,255,255,0.45);
}
.ic{
  position:absolute;
  left:0;
  background:transparent !important;
  border:none !important;
  width:40px;
  text-align:center;
  font-size:28px;
  color:#bc8557 !important;
}

.txt{
    flex: 1;
    text-align: center;
}

.txt b{
    font-size: 20px;
    white-space: nowrap;
}

.txt small{
  color:var(--muted);
  font-size:20px;
}

.footer{
  text-align:center;
  color:#000000;
  font-size:15px;
  margin-top:20px;
}

.footer a{
  color:#000000;
  text-decoration:none;
}
